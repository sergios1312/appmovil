<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow - Autenticación</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0F1117;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #6C5CE7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    p { color: #888; font-size: 0.9rem; }
    a { color: #6C5CE7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Redirigiendo a TaskFlow...</h2>
    <p id="status">Procesando autenticación...</p>
  </div>

  <script>
    (function() {
      try {
        // Google pone el access_token en el fragmento (#) de la URL
        var hash = window.location.hash.substring(1);
        if (!hash) {
          document.getElementById('status').textContent = 'Error: No se recibieron datos de Google.';
          return;
        }

        var params = new URLSearchParams(hash);
        var accessToken = params.get('access_token');
        var state = params.get('state'); // Contiene la URL de retorno (exp://...)

        if (!accessToken) {
          document.getElementById('status').textContent = 'Error: No se recibió el token de acceso.';
          return;
        }

        if (!state) {
          document.getElementById('status').textContent = 'Error: No se recibió la URL de retorno.';
          return;
        }

        // Decodificar la URL de retorno y agregarle el token
        var returnUrl = decodeURIComponent(state);
        var separator = returnUrl.indexOf('?') >= 0 ? '&' : '?';
        var redirectUrl = returnUrl + separator + 'access_token=' + encodeURIComponent(accessToken);

        document.getElementById('status').textContent = 'Abriendo TaskFlow...';

        // Redirigir al esquema de la app (exp://...)
        window.location.href = redirectUrl;

        // Fallback: si la redirección no funciona después de 3 segundos, mostrar link manual
        setTimeout(function() {
          document.getElementById('status').innerHTML =
            'Si no se abrió automáticamente, <a href="' + redirectUrl + '">toca aquí para volver a la app</a>.';
        }, 3000);

      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
      }
    })();
  </script>
</body>
</html>
